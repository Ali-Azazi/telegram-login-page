<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Mini App Auth</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      /* CSS variables linked directly to Telegram's native theme system */
      body {
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      .tg-button {
        background-color: var(--tg-theme-button-color, #2481cc);
        color: var(--tg-theme-button-text-color, #ffffff);
      }
      .tg-secondary-bg {
        background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      }
      .tg-hint {
        color: var(--tg-theme-hint-color, #707579);
      }
    </style>
  </head>
  <body class="p-4 min-h-screen flex flex-col justify-between">
    <div class="w-full max-w-md mx-auto my-auto">
      <div id="loginView" class="hidden space-y-6">
        <div class="text-center">
          <h2 class="text-2xl font-bold tracking-tight">Welcome</h2>
          <p class="tg-hint text-sm mt-1">Please sign in to your account</p>
        </div>

        <form id="loginForm" class="space-y-4">
          <div>
            <label for="loginId" class="block text-sm font-medium mb-1"
              >Username or Email</label
            >
            <input
              type="text"
              id="loginId"
              required
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--tg-theme-button-color,#2481cc)] bg-[var(--tg-theme-bg-color,#fff)] text-[var(--tg-theme-text-color,#000)] border-gray-300"
            />
          </div>
          <div>
            <label for="passwd" class="block text-sm font-medium mb-1"
              >Password</label
            >
            <input
              type="password"
              id="passwd"
              required
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--tg-theme-button-color,#2481cc)] bg-[var(--tg-theme-bg-color,#fff)] text-[var(--tg-theme-text-color,#000)] border-gray-300"
            />
          </div>

          <div
            id="errorMessage"
            class="hidden text-sm font-semibold text-red-500 p-2 rounded tg-secondary-bg text-center"
          ></div>

          <button
            type="submit"
            id="submitBtn"
            class="w-full tg-button py-2.5 rounded-lg font-medium transition duration-200 cursor-pointer text-center"
          >
            Sign In
          </button>
        </form>
      </div>

      <div id="dashboardView" class="hidden space-y-6">
        <div class="flex items-center space-x-4 p-4 rounded-xl tg-secondary-bg">
          <img
            id="userAvatar"
            src=""
            alt="Profile"
            class="w-16 h-16 rounded-full object-cover bg-gray-300 border-2 border-[var(--tg-theme-button-color)]"
          />
          <div>
            <h3 class="text-xl font-bold flex items-center gap-1">
              <span id="txtFirstName"></span> <span id="txtLastName"></span>
            </h3>
            <p class="text-sm tg-hint" id="txtEmail"></p>
            <span
              id="badgeUserType"
              class="inline-block mt-1 text-xs px-2 py-0.5 rounded tg-button font-semibold"
            ></span>
          </div>
        </div>

        <div class="space-y-3">
          <h4 class="text-xs font-semibold uppercase tracking-wider tg-hint">
            Account Details
          </h4>
          <div
            class="rounded-xl border border-gray-200 divide-y divide-gray-100 overflow-hidden text-sm"
          >
            <div class="flex justify-between p-3 bg-[var(--tg-theme-bg-color)]">
              <span class="tg-hint">Username</span>
              <span class="font-medium" id="txtUsername"></span>
            </div>
            <div class="flex justify-between p-3 bg-[var(--tg-theme-bg-color)]">
              <span class="tg-hint">Organization</span>
              <span class="font-medium" id="txtOrgName"></span>
            </div>
            <div class="flex justify-between p-3 bg-[var(--tg-theme-bg-color)]">
              <span class="tg-hint">Active Roles</span>
              <span
                class="font-medium text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded"
                id="txtRoles"
              ></span>
            </div>
          </div>
        </div>

        <div class="space-y-2">
          <button
            id="logoutBtn"
            class="w-full bg-red-500 text-white py-2.5 rounded-lg font-medium transition duration-200 cursor-pointer text-center"
          >
            Log Out
          </button>
        </div>
      </div>
    </div>

    <script>
      // Initialize Telegram Web App SDK
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand(); // Make the Mini App occupy full screen height

      const API_URL =
        "https://kappa.nsu.ru:8061/user-micro-services/v2/session/new";

      // DOM Element Selectors
      const loginView = document.getElementById("loginView");
      const dashboardView = document.getElementById("dashboardView");
      const loginForm = document.getElementById("loginForm");
      const errorMessage = document.getElementById("errorMessage");
      const submitBtn = document.getElementById("submitBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      // Application Startup Lifecycle Execution
      document.addEventListener("DOMContentLoaded", () => {
        const savedSession = localStorage.getItem("user_session");
        if (savedSession) {
          try {
            const userData = JSON.parse(savedSession);
            // Check if token has expired
            if (new Date(userData.tokenExpiryDate) > new Date()) {
              renderDashboard(userData);
              return;
            }
          } catch (e) {
            localStorage.removeItem("user_session");
          }
        }
        // Defaults to login view if no valid session exists
        loginView.classList.remove("hidden");
      });

      // Handle Login Submission
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();
        setLoading(true);

        const loginId = document.getElementById("loginId").value.trim();
        const passwd = document.getElementById("passwd").value;

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ loginId, passwd }),
          });

          if (response.ok) {
            const data = await response.json();
            localStorage.setItem("user_session", JSON.stringify(data));

            // Critical Integration Step: Inform Bot backend to swap the Menu button via dynamic standard format
            if (tg.initData) {
              tg.sendData(JSON.stringify({ event: "login_success" }));
            }

            renderDashboard(data);
          } else {
            handleErrorCodes(response.status);
          }
        } catch (error) {
          showError("Network error. Please check your connection and retry.");
        } finally {
          setLoading(false);
        }
      });

      // Handle Logout Action
      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("user_session");

        // Critical Integration Step: Inform Bot backend to revert Menu Button back to "Log In"
        if (tg.initData) {
          tg.sendData(JSON.stringify({ event: "logout_success" }));
        }

        dashboardView.classList.add("hidden");
        loginForm.reset();
        loginView.classList.remove("hidden");
      });

      // Render Dashboard UI with Response Object Metrics
      function renderDashboard(data) {
        loginView.classList.add("hidden");

        document.getElementById("txtFirstName").innerText =
          data.firstName || "";
        document.getElementById("txtLastName").innerText = data.lastName || "";
        document.getElementById("txtEmail").innerText = data.email || "N/A";
        document.getElementById("txtUsername").innerText =
          data.userName || "N/A";
        document.getElementById("txtOrgName").innerText =
          data.orgDetails?.orgName || "No Organization";
        document.getElementById("badgeUserType").innerText =
          data.userTypeDetails?.userType || "User";
        document.getElementById("txtRoles").innerText = data.activeRoles
          ? data.activeRoles.join(", ")
          : "None";

        const avatarImg = document.getElementById("userAvatar");
        avatarImg.src =
          data.profilePic ||
          "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y";

        dashboardView.classList.remove("hidden");
      }

      // Process HTTP Status Errors
      function handleErrorCodes(status) {
        switch (status) {
          case 401:
            showError("Invalid credentials. Please verify entry details.");
            break;
          case 403:
            showError("Account disabled or pending activation. Access denied.");
            break;
          case 422:
            showError(
              "Validation Error. Please check input parameter formats.",
            );
            break;
          case 404:
            showError("Authentication service path target not found.");
            break;
          default:
            showError(`Server error encountered. Status Code: ${status}`);
        }
      }

      function showError(msg) {
        errorMessage.innerText = msg;
        errorMessage.classList.remove("hidden");
      }

      function hideError() {
        errorMessage.classList.add("hidden");
        errorMessage.innerText = "";
      }

      function setLoading(isLoading) {
        if (isLoading) {
          submitBtn.disabled = true;
          submitBtn.innerText = "Authenticating...";
          submitBtn.style.opacity = "0.6";
        } else {
          submitBtn.disabled = false;
          submitBtn.innerText = "Sign In";
          submitBtn.style.opacity = "1";
        }
      }
    </script>
  </body>
</html>
