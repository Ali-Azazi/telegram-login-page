<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Account Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 320px; }
        h3 { text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .error { color: #e53935; margin-top: 12px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h3>Sign In to Your Account</h3>
        
        <div class="form-group">
            <label for="loginId">Username or Email</label>
            <input type="text" id="loginId" placeholder="Enter your login ID">
        </div>

        <div class="form-group">
            <label for="passwd">Password</label>
            <input type="password" id="passwd" placeholder="Enter your password">
        </div>

        <button id="loginBtn" onclick="executeLogin()">Login</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Get the telegram ID passed from bot.py
        const urlParams = new URLSearchParams(window.location.search);
        const tgId = urlParams.get('tg_id');

        async function executeLogin() {
            const loginId = document.getElementById('loginId').value;
            const passwd = document.getElementById('passwd').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = "";

            if (!loginId || !passwd) {
                errorMsg.innerText = "Please fill in all fields.";
                return;
            }

            try {
                // 1. Resolve External IP Address via public API
                let ipAddress = "127.0.0.1";
                try {
                    const ipRes = await fetch('https://kappa.nsu.ru:8061/user-micro-services/v2/docs#/Session%20Management/new_session_session_new_post?format=json');
                    const ipData = await ipRes.json();
                    ipAddress = ipData.ip;
                } catch(e) { console.log("Fallback to local IP lookup reference"); }

                // 2. Build Device Context
                const deviceInfo = `TelegramMiniApp-${tg.platform} (${navigator.userAgent})`;

                // 3. Exact matching structure for your target API payload
                // Plus sending 'tgId' in custom header so backend can link accounts
                const response = await fetch('https://kappa.nsu.ru:8061/user-micro-services/v2/docs#/Session%20Management/new_session_session_new_post', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Telegram-User-Id': tgId // Optional header approach to track link request
                    },
                    body: JSON.stringify({
                        loginId: loginId,
                        passwd: passwd,
                        ipAddress: ipAddress,
                        deviceInfo: deviceInfo
                    })
                });

                if (response.ok) {
                    // Success! Close the webview modal window inside Telegram automatically
                    tg.close();
                } else {
                    const errData = await response.json().catch(() => ({}));
                    errorMsg.innerText = errData.message || "Invalid credentials, please try again.";
                }
            } catch (err) {
                errorMsg.innerText = "Connection error. Check your backend configurations/CORS.";
                console.error(err);
            }
        }
    </script>
</body>
</html>
